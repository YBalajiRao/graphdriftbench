# Roughly mimics tgbl-wiki's shape: 8,227 sources, 1,000 destinations, ~157K events,
# heavy-tailed destination popularity, 172-d edge marks. Block structure is NOT fitted to the data.
mode: bipartite
n_src: 8227
n_dst: 1000
k_src: 8
k_dst: 8
block_matrix: {kind: assortative, p_in: 1.0, p_out: 0.15}
base_rate: 157.474
t_end: 1000.0
d_node: 8
node_sigma: 0.5
beta_h: 0.5
d_edge: 172
edge_sigma: 1.0
pop_src: {kind: pareto, alpha: 2.5}
pop_dst: {kind: pareto, alpha: 1.2}
window_events: 5000
seed: 0
